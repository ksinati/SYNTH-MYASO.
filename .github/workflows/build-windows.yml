name: Build Windows VST3

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Get source
        uses: actions/checkout@v4

      - name: Configure
        - run: cmake -S "${{ github.workspace }}" -B build -A x64

      - name: Build
        run: cmake --build build --config Release --target SYNTH_MYASO

      - name: Upload plugin
        uses: actions/upload-artifact@v4
        with:
          name: SYNTH-MYASO-Windows-VST3
          path: build/SYNTH_MYASO_artefacts/Release/VST3/
